<div class="dialog-container">
  <!-- Header -->
  <div class="dialog-header">
    <div class="header-content">
      <mat-icon class="header-icon">lock_reset</mat-icon>
      <span class="header-title">Reset Password</span>
    </div>
    <button class="close-button" mat-icon-button mat-dialog-close>
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <mat-dialog-content class="dialog-content">
    <p class="dialog-subtitle">Enter your email address and we'll send you a new password</p>

    <form [formGroup]="forgotPasswordForm" class="auth-form">
      <div class="form-fields">
        <mat-form-field appearance="outline" class="modern-field">
          <mat-label>Email Address</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <input matInput formControlName="email" required placeholder="Enter your registered email">
          <mat-error *ngIf="forgotPasswordForm.controls.email.touched && forgotPasswordForm.controls.email.invalid">
            <span *ngIf="forgotPasswordForm.controls.email.errors.required">Email is required</span>
            <span *ngIf="forgotPasswordForm.controls.email.errors.pattern">Please enter a valid email</span>
          </mat-error>
        </mat-form-field>
      </div>
    </form>
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions class="dialog-actions">
    <button mat-stroked-button class="btn-secondary" mat-dialog-close>
      Cancel
    </button>
    <button mat-flat-button class="btn-primary" type="submit" (click)="handleSubmit()"
      [disabled]="!(forgotPasswordForm.valid && forgotPasswordForm.dirty)">
      <mat-icon>send</mat-icon>
      Send Reset Link
    </button>
  </mat-dialog-actions>
</div>
