<div class="dashboard-container">
    <!-- Page Header -->
    <div class="page-header">
        <h1 class="page-title">
            <mat-icon>dashboard</mat-icon>
            Dashboard
        </h1>
        <p class="page-subtitle">Welcome back! Here's an overview of your cafe.</p>
    </div>

    <!-- Stats Cards Grid -->
    <div class="stats-grid">
        <!-- Categories Card -->
        <div class="stat-card categories">
            <div class="card-icon">
                <mat-icon>category</mat-icon>
            </div>
            <div class="card-content">
                <h3 class="stat-value">{{ data?.category || 0 }}</h3>
                <p class="stat-label">Categories</p>
            </div>
            <div class="card-decoration"></div>
        </div>

        <!-- Products Card -->
        <div class="stat-card products">
            <div class="card-icon">
                <mat-icon>inventory_2</mat-icon>
            </div>
            <div class="card-content">
                <h3 class="stat-value">{{ data?.product || 0 }}</h3>
                <p class="stat-label">Products</p>
            </div>
            <div class="card-decoration"></div>
        </div>

        <!-- Bills Card -->
        <div class="stat-card bills">
            <div class="card-icon">
                <mat-icon>receipt_long</mat-icon>
            </div>
            <div class="card-content">
                <h3 class="stat-value">{{ data?.bill || 0 }}</h3>
                <p class="stat-label">Bills Generated</p>
            </div>
            <div class="card-decoration"></div>
        </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
        <h2 class="section-title">Quick Actions</h2>
        <div class="actions-grid">
            <button mat-raised-button class="action-btn" routerLink="/cafe/order">
                <mat-icon>add_shopping_cart</mat-icon>
                Create Order
            </button>
            <button mat-raised-button class="action-btn" routerLink="/cafe/bill">
                <mat-icon>visibility</mat-icon>
                View Bills
            </button>
            <button mat-raised-button class="action-btn" routerLink="/cafe/product" *ngIf="isAdmin">
                <mat-icon>add_circle</mat-icon>
                Add Product
            </button>
        </div>
    </div>
</div>
