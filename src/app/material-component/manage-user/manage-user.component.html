<div class="manage-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-left">
            <h1 class="page-title">
                <mat-icon>people</mat-icon>
                Manage Users
            </h1>
            <p class="page-subtitle">View and manage user accounts</p>
        </div>
    </div>

    <!-- Search & Filter -->
    <div class="filter-section">
        <mat-form-field appearance="outline" class="search-field">
            <mat-label>Search Users</mat-label>
            <mat-icon matPrefix>search</mat-icon>
            <input matInput (keyup)="applyFilter($event)" placeholder="Search by name, email, or contact...">
        </mat-form-field>
    </div>

    <!-- Data Table -->
    <div class="table-container">
        <div class="responsive_table">
            <table mat-table [dataSource]="dataSource" matSort class="modern-table">

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
                </ng-container>

                <!-- Email Column -->
                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                    <td mat-cell *matCellDef="let element">{{ element.email }}</td>
                </ng-container>

                <!-- Contact Column -->
                <ng-container matColumnDef="contactNumber">
                    <th mat-header-cell *matHeaderCellDef>Contact</th>
                    <td mat-cell *matCellDef="let element">{{ element.contactNumber }}</td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let element">
                        <span class="status-badge" [class.active]="element.status === 'true'"
                            [class.inactive]="element.status !== 'true'">
                            {{ element.status === 'true' ? 'Active' : 'Inactive' }}
                        </span>
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button class="action-icon toggle" [class.active]="element.status === 'true'"
                            [class.inactive]="element.status !== 'true'" matTooltip="Toggle Status"
                            (click)="handleToggleStatus(element)">
                            <mat-icon>{{ element.status === 'true' ? 'toggle_on' : 'toggle_off' }}</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
</div>
