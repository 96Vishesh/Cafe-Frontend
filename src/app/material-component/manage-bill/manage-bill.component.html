<div class="manage-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-left">
            <h1 class="page-title">
                <mat-icon>receipt_long</mat-icon>
                View Bills
            </h1>
            <p class="page-subtitle">View and manage all generated bills</p>
        </div>
    </div>

    <!-- Search & Filter -->
    <div class="filter-section">
        <mat-form-field appearance="outline" class="search-field">
            <mat-label>Search Bills</mat-label>
            <mat-icon matPrefix>search</mat-icon>
            <input matInput (keyup)="applyFilter($event)" placeholder="Search by name, email, or contact...">
        </mat-form-field>
    </div>

    <!-- Data Table -->
    <div class="table-container">
        <div class="responsive_table">
            <table mat-table [dataSource]="dataSource" matSort class="modern-table">

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Customer Name</th>
                    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
                </ng-container>

                <!-- Email Column -->
                <ng-container matColumnDef="email">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
                    <td mat-cell *matCellDef="let element">{{ element.email }}</td>
                </ng-container>

                <!-- Contact Column -->
                <ng-container matColumnDef="contactNumber">
                    <th mat-header-cell *matHeaderCellDef>Contact</th>
                    <td mat-cell *matCellDef="let element">{{ element.contactNumber }}</td>
                </ng-container>

                <!-- Payment Method Column -->
                <ng-container matColumnDef="paymentMethod">
                    <th mat-header-cell *matHeaderCellDef>Payment</th>
                    <td mat-cell *matCellDef="let element">
                        <span class="payment-badge">{{ element.paymentMethod }}</span>
                    </td>
                </ng-container>

                <!-- Total Column -->
                <ng-container matColumnDef="total">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Total</th>
                    <td mat-cell *matCellDef="let element" class="total-cell">₹{{ element.total }}</td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let element" class="actions-cell">
                        <button mat-icon-button class="action-icon view" matTooltip="View Products"
                            (click)="viewBillProducts(element)">
                            <mat-icon>visibility</mat-icon>
                        </button>
                        <button mat-icon-button class="action-icon download" matTooltip="Download PDF"
                            (click)="downloadBill(element)">
                            <mat-icon>download</mat-icon>
                        </button>
                        <button mat-icon-button class="action-icon delete" matTooltip="Delete Bill"
                            (click)="handleDeleteAction(element)" *ngIf="isAdmin">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
</div>
