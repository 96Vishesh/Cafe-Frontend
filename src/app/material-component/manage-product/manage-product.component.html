<div class="manage-container">
    <!-- Page Header -->
    <div class="page-header">
        <div class="header-left">
            <h1 class="page-title">
                <mat-icon>inventory_2</mat-icon>
                Manage Products
            </h1>
            <p class="page-subtitle">Create and manage your cafe products</p>
        </div>
        <button mat-raised-button class="add-btn" (click)="handleAddAction()">
            <mat-icon>add</mat-icon>
            Add Product
        </button>
    </div>

    <!-- Search & Filter -->
    <div class="filter-section">
        <mat-form-field appearance="outline" class="search-field">
            <mat-label>Search Products</mat-label>
            <mat-icon matPrefix>search</mat-icon>
            <input matInput (keyup)="applyFilter($event)" placeholder="Type to search...">
        </mat-form-field>
    </div>

    <!-- Data Table -->
    <div class="table-container">
        <div class="responsive_table">
            <table mat-table [dataSource]="dataSource" matSort class="modern-table">

                <!-- Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                    <td mat-cell *matCellDef="let element">{{ element.name }}</td>
                </ng-container>

                <!-- Category Column -->
                <ng-container matColumnDef="categoryName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
                    <td mat-cell *matCellDef="let element">{{ element.categoryName }}</td>
                </ng-container>

                <!-- Description Column -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef>Description</th>
                    <td mat-cell *matCellDef="let element">{{ element.description }}</td>
                </ng-container>

                <!-- Price Column -->
                <ng-container matColumnDef="price">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
                    <td mat-cell *matCellDef="let element">₹{{ element.price }}</td>
                </ng-container>

                <!-- Status Column -->
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef>Status</th>
                    <td mat-cell *matCellDef="let element">
                        <span class="status-badge" [class.active]="element.status === 'true'"
                            [class.inactive]="element.status !== 'true'">
                            {{ element.status === 'true' ? 'Active' : 'Inactive' }}
                        </span>
                    </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="edit">
                    <th mat-header-cell *matHeaderCellDef>Actions</th>
                    <td mat-cell *matCellDef="let element" class="actions-cell">
                        <button mat-icon-button class="action-icon toggle" [class.active]="element.status === 'true'"
                            [class.inactive]="element.status !== 'true'" matTooltip="Toggle Status"
                            (click)="handleToggleStatus(element)">
                            <mat-icon>{{ element.status === 'true' ? 'toggle_on' : 'toggle_off' }}</mat-icon>
                        </button>
                        <button mat-icon-button class="action-icon edit" matTooltip="Edit Product"
                            (click)="handleEditAction(element)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button class="action-icon delete" matTooltip="Delete Product"
                            (click)="handleDeleteAction(element)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
</div>
