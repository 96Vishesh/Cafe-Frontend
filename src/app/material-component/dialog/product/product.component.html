<div class="dialog-container">
    <!-- Header -->
    <div class="dialog-header">
        <div class="header-content">
            <mat-icon class="header-icon">inventory_2</mat-icon>
            <span class="header-title">{{ dialogAction }} Product</span>
        </div>
        <button class="close-button" mat-icon-button mat-dialog-close>
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <!-- Content -->
    <mat-dialog-content class="dialog-content">
        <form [formGroup]="productForm" class="dialog-form">
            <!-- Name -->
            <mat-form-field appearance="outline" class="modern-field">
                <mat-label>Product Name</mat-label>
                <mat-icon matPrefix>label</mat-icon>
                <input matInput formControlName="name" required placeholder="Enter product name">
                <mat-error *ngIf="productForm.controls.name.touched && productForm.controls.name.invalid">
                    Product name is required
                </mat-error>
            </mat-form-field>

            <!-- Category -->
            <mat-form-field appearance="outline" class="modern-field">
                <mat-label>Category</mat-label>
                <mat-icon matPrefix>category</mat-icon>
                <mat-select formControlName="categoryId" required>
                    <mat-option *ngFor="let category of categories" [value]="category.id">
                        {{ category.name }}
                    </mat-option>
                </mat-select>
                <mat-error *ngIf="productForm.controls.categoryId.touched && productForm.controls.categoryId.invalid">
                    Category is required
                </mat-error>
            </mat-form-field>

            <!-- Price -->
            <mat-form-field appearance="outline" class="modern-field">
                <mat-label>Price</mat-label>
                <mat-icon matPrefix>currency_rupee</mat-icon>
                <input matInput formControlName="price" required type="number" placeholder="Enter price">
                <mat-error *ngIf="productForm.controls.price.touched && productForm.controls.price.invalid">
                    Price is required
                </mat-error>
            </mat-form-field>

            <!-- Description -->
            <mat-form-field appearance="outline" class="modern-field">
                <mat-label>Description</mat-label>
                <mat-icon matPrefix>description</mat-icon>
                <textarea matInput formControlName="description" required rows="3"
                    placeholder="Enter product description"></textarea>
                <mat-error *ngIf="productForm.controls.description.touched && productForm.controls.description.invalid">
                    Description is required
                </mat-error>
            </mat-form-field>
        </form>
    </mat-dialog-content>

    <!-- Actions -->
    <mat-dialog-actions class="dialog-actions">
        <button mat-stroked-button class="btn-secondary" mat-dialog-close>Cancel</button>
        <button mat-flat-button class="btn-primary" [disabled]="!productForm.valid" (click)="onSubmit()">
            <mat-icon>{{ dialogAction === 'Add' ? 'add' : 'save' }}</mat-icon>
            {{ dialogAction }}
        </button>
    </mat-dialog-actions>
</div>
