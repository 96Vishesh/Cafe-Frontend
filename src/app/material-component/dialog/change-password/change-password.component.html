<div class="dialog-container">
    <!-- Header -->
    <div class="dialog-header">
        <div class="header-content">
            <mat-icon class="header-icon">lock</mat-icon>
            <span class="header-title">Change Password</span>
        </div>
        <button class="close-button" mat-icon-button mat-dialog-close>
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <!-- Content -->
    <mat-dialog-content class="dialog-content">
        <form [formGroup]="changePasswordForm" class="dialog-form">
            <!-- Old Password -->
            <mat-form-field appearance="outline" class="modern-field">
                <mat-label>Current Password</mat-label>
                <mat-icon matPrefix>lock_open</mat-icon>
                <input matInput formControlName="oldPassword" required [type]="hideOld ? 'password' : 'text'">
                <button type="button" mat-icon-button matSuffix (click)="hideOld = !hideOld">
                    <mat-icon>{{ hideOld ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error
                    *ngIf="changePasswordForm.controls.oldPassword.touched && changePasswordForm.controls.oldPassword.invalid">
                    Current password is required
                </mat-error>
            </mat-form-field>

            <!-- New Password -->
            <mat-form-field appearance="outline" class="modern-field">
                <mat-label>New Password</mat-label>
                <mat-icon matPrefix>lock</mat-icon>
                <input matInput formControlName="newPassword" required [type]="hideNew ? 'password' : 'text'">
                <button type="button" mat-icon-button matSuffix (click)="hideNew = !hideNew">
                    <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error
                    *ngIf="changePasswordForm.controls.newPassword.touched && changePasswordForm.controls.newPassword.invalid">
                    New password is required
                </mat-error>
            </mat-form-field>

            <!-- Confirm Password -->
            <mat-form-field appearance="outline" class="modern-field">
                <mat-label>Confirm Password</mat-label>
                <mat-icon matPrefix>lock_outline</mat-icon>
                <input matInput formControlName="confirmPassword" required [type]="hideConfirm ? 'password' : 'text'">
                <button type="button" mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm">
                    <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
                <mat-error
                    *ngIf="changePasswordForm.controls.confirmPassword.touched && changePasswordForm.controls.confirmPassword.invalid">
                    Confirm password is required
                </mat-error>
            </mat-form-field>
        </form>
    </mat-dialog-content>

    <!-- Actions -->
    <mat-dialog-actions class="dialog-actions">
        <button mat-stroked-button class="btn-secondary" mat-dialog-close>Cancel</button>
        <button mat-flat-button class="btn-primary" [disabled]="!changePasswordForm.valid" (click)="onSubmit()">
            <mat-icon>save</mat-icon>
            Update Password
        </button>
    </mat-dialog-actions>
</div>
